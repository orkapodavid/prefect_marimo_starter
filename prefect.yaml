name: prefect-marimo-workflows
prefect-version: "3.0"

# Reusable definitions
definitions:
  work_pools:
    windows_pool: &windows_pool
      name: windows-process-pool
      work_queue_name: default
  
  schedules:
    daily_6am: &daily_6am
      cron: "0 6 * * *"
      timezone: "Asia/Hong_Kong"
    
    hourly_business: &hourly_business
      cron: "0 9-18 * * 1-5"
      timezone: "Asia/Hong_Kong"
    
    asx_market_close: &asx_market_close
      cron: "0 18 * * 1-5"
      timezone: "Australia/Sydney"
    
    asx_morning_midday_close: &asx_morning_midday_close
      cron: "30 9,13,16 * * 1-5"
      timezone: "Australia/Sydney"
    
    asx_appendix5b_times: &asx_appendix5b_times
      cron: "0 10,14,17 * * 1-5"
      timezone: "Australia/Sydney"

# Deployments point directly to notebook flows

# Generic pull step for all deployments (avoids "remote storage" prompts)
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: C:\Users\orkap\Desktop\Programming\prefect_marimo_starter

deployments:
  - name: daily-data-sync-dev
    entrypoint: notebooks/etl/daily_data_sync.py:run_daily_sync
    description: "Daily data sync - Development"
    tags: [dev, etl]
    parameters:
      source: "data/dev/input.parquet"
      destination: "data/dev/output.parquet"
      environment: "dev"
    work_pool: *windows_pool
    schedules: []

  - name: daily-data-sync-prod
    entrypoint: notebooks/etl/daily_data_sync.py:run_daily_sync
    description: "Daily data sync - Production"
    tags: [prod, etl]
    parameters:
      source: "//fileserver/data/input/daily.parquet"
      destination: "//fileserver/data/output/synced.parquet"
      environment: "prod"
    work_pool: *windows_pool
    schedules:
      - *daily_6am

  - name: daily-summary-report
    entrypoint: notebooks/reports/daily_summary.py:run_report
    description: "Daily summary report generation"
    tags: [prod, reports]
    work_pool: *windows_pool
    schedules:
      - cron: "0 7 * * *"
        timezone: "Asia/Hong_Kong"

  - name: pg-backup-daily
    entrypoint: notebooks/maintenance/maintenance_pg_backup.py:run_pg_backup
    description: "Daily PostgreSQL logical backup"
    tags: [prod, maintenance, postgres, backup]
    parameters:
      database: "workflow_app"
      backup_dir: "D:/Backups/postgres"
      retention_days: 30
      compression_level: 6
      verify_restore: true
      dry_run: false
    work_pool: *windows_pool
    schedules:
      - cron: "0 2 * * *"
        timezone: "Asia/Hong_Kong"

  # ASX Scraper Deployments
  - name: asx-pipe-scraper-daily
    entrypoint: notebooks/asx/asx_pipe_scraper.py:run_pipe_scraper
    description: "ASX PIPE/Placement announcements scraper - Daily scan"
    tags: [prod, asx, pipe]
    parameters:
      output_dir: "./outputs/pipe"
      period: "week"
      sample_size: 0
      download_pdfs: false
      use_database: true
    work_pool: *windows_pool
    schedules:
      - *asx_market_close

  - name: asx-announcement-scraper-watchlist
    entrypoint: notebooks/asx/asx_announcement_scraper.py:run_announcement_scraper
    description: "ASX announcement scraper for watchlist tickers"
    tags: [prod, asx, watchlist]
    parameters:
      tickers: ["CBA", "NAB", "BHP", "RIO", "WES"]
      period: "today"
      output_dir: "./outputs/watchlist"
      download_pdfs: true
      output_format: "both"
      use_database: true
    work_pool: *windows_pool
    schedules:
      - *asx_morning_midday_close

  - name: asx-appendix5b-scraper-daily
    entrypoint: notebooks/asx/asx_appendix5b_scraper.py:run_appendix5b_scraper
    description: "ASX Appendix 5B cash flow report scraper"
    tags: [prod, asx, appendix5b]
    parameters:
      output_dir: "./outputs/appendix5b"
      download_pdfs: true
      use_database: true
    work_pool: *windows_pool
    schedules:
      - *asx_appendix5b_times

  # TDnet Announcement Scraper Deployments
  - name: tdnet-announcement-scraper-en-daily
    entrypoint: notebooks/tdnet/tdnet_announcement_scraper.py:run_tdnet_scraper
    description: "TDnet English announcements - Daily scrape"
    tags: [prod, tdnet, english]
    parameters:
      language: "english"
      period: "today"
      output_dir: "./data/output/tdnet_announcements"
      output_format: "csv"
    work_pool: *windows_pool
    schedules:
      - cron: "0 18 * * 1-5"
        timezone: "Asia/Tokyo"

  - name: tdnet-announcement-scraper-en-backfill
    entrypoint: notebooks/tdnet/tdnet_announcement_scraper.py:run_tdnet_scraper
    description: "TDnet English announcements - Backfill past month (manual trigger)"
    tags: [dev, tdnet, english, backfill]
    parameters:
      language: "english"
      period: "month"
      output_dir: "./data/output/tdnet_announcements"
      output_format: "csv"
    work_pool: *windows_pool
    schedules: []

  - name: tdnet-announcement-scraper-jp-daily
    entrypoint: notebooks/tdnet/tdnet_announcement_scraper.py:run_tdnet_scraper
    description: "TDnet Japanese announcements - Daily scrape"
    tags: [prod, tdnet, japanese]
    parameters:
      language: "japanese"
      period: "today"
      output_dir: "./data/output/tdnet_announcements"
      output_format: "csv"
    work_pool: *windows_pool
    schedules:
      - cron: "0 18 * * 1-5"
        timezone: "Asia/Tokyo"

  - name: tdnet-announcement-scraper-jp-backfill
    entrypoint: notebooks/tdnet/tdnet_announcement_scraper.py:run_tdnet_scraper
    description: "TDnet Japanese announcements - Backfill past month (manual trigger)"
    tags: [dev, tdnet, japanese, backfill]
    parameters:
      language: "japanese"
      period: "month"
      output_dir: "./data/output/tdnet_announcements"
      output_format: "csv"
    work_pool: *windows_pool
    schedules: []
